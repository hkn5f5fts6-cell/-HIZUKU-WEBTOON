<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="manifest" href="manifest.webmanifest"><title>HIZUKU</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}body{overscroll-behavior-y:none}.progress{position:fixed;z-index:30;top:0;left:0;height:3px;background:#fff;width:0}.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 18px 22px;background:linear-gradient(#050505 25%,transparent);transition:.25s}.top.hide,.nav.hide{opacity:0;pointer-events:none}.logo{font-weight:900;letter-spacing:.2em;font-size:17px}.episode{font-size:12px;opacity:.7;margin-top:4px}.reader{max-width:760px;margin:auto;min-height:100vh;padding-top:74px}.chapter{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px}.chapter h1{font-size:28px;margin:0 0 8px}.chapter p{color:#999;line-height:1.7;margin:0}.page{display:block;width:100%;height:auto;margin:0}.gap{height:9vh}.nav{position:fixed;z-index:20;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px;background:#111e;border:1px solid #333;border-radius:999px;backdrop-filter:blur(14px);transition:.25s}button,select{appearance:none;background:#222;color:#fff;border:1px solid #444;border-radius:999px;height:42px;padding:0 14px;font-weight:700}select{min-width:145px;text-align:center}button:disabled{opacity:.3}.end{text-align:center;padding:18vh 20px 28vh;color:#888}.end strong{display:block;color:#fff;font-size:22px;margin-bottom:8px}@media(min-width:761px){.reader{box-shadow:0 0 80px #000}}</style></head><body><div id="progress" class="progress"></div><header id="top" class="top"><div class="logo">HIZUKU</div><div id="epName" class="episode"></div></header><main id="reader" class="reader"></main><nav id="nav" class="nav"><button id="prev">‹</button><select id="eps"></select><button id="next">›</button></nav><script>const DATA=[{id:1,title:'第1話「出会い」',images:[]},{id:2,title:'第2話「契約」',images:[]}];let i=Math.min(DATA.length-1,Math.max(0,+(localStorage.hizukuEp||0)));const $=q=>document.querySelector(q),r=$('#reader'),sel=$('#eps'),top=$('#top'),nav=$('#nav');DATA.forEach((e,n)=>sel.add(new Option(e.title,n)));function render(){const e=DATA[i];localStorage.hizukuEp=i;sel.value=i;$('#epName').textContent=e.title;$('#prev').disabled=i===0;$('#next').disabled=i===DATA.length-1;if(e.images.length){r.innerHTML='<div class="chapter"><div><h1>'+e.title+'</h1><p>縦スクロール版</p></div></div>'+e.images.map((x,n)=>'<img class="page" src="'+x+'?v=2" loading="'+(n<2?'eager':'lazy')+'" alt="'+e.title+' '+(n+1)+'"><div class="gap"></div>').join('')+'<div class="end"><strong>'+e.title+'・終</strong>次の話へ</div>'}else{r.innerHTML='<div class="chapter"><div><h1>'+e.title+'</h1><p>正史原稿を編集中です。<br>公開するとこの画面へ自動反映されます。</p></div></div>'}requestAnimationFrame(()=>scrollTo(0,+(localStorage['hizukuY'+i]||0)))}sel.onchange=()=>{i=+sel.value;render()};$('#prev').onclick=()=>{if(i){i--;scrollTo(0,0);render()}};$('#next').onclick=()=>{if(i<DATA.length-1){i++;scrollTo(0,0);render()}};r.onclick=()=>{top.classList.toggle('hide');nav.classList.toggle('hide')};addEventListener('scroll',()=>{const m=document.documentElement.scrollHeight-innerHeight,y=scrollY;$('#progress').style.width=(m?100*y/m:0)+'%';localStorage['hizukuY'+i]=y},{passive:true});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(reg=>reg.update());render();</script></body></html>
