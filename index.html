<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="manifest" href="manifest.webmanifest"><title>HIZUKU WEBTOON</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}header{position:fixed;z-index:10;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(#050505,transparent);transition:.25s}header.hide{opacity:0;pointer-events:none}.title{font-weight:800;letter-spacing:.12em}.sub{font-size:12px;opacity:.7;margin-top:3px}main{max-width:760px;margin:auto;min-height:100vh;padding-top:72px}.empty{padding:30vh 24px;text-align:center;color:#aaa}.empty b{display:block;color:#fff;font-size:20px;margin-bottom:10px}.page{display:block;width:100%;height:auto}.bar{position:fixed;top:0;left:0;height:3px;background:#fff;z-index:20;width:0}.controls{position:fixed;z-index:10;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#111d;padding:8px;border-radius:999px;transition:.25s}.controls.hide{opacity:0;pointer-events:none}button,select{background:#222;color:#fff;border:1px solid #444;border-radius:999px;padding:9px 12px}button:disabled{opacity:.35}</style></head><body><div id="bar" class="bar"></div><header id="head"><div class="title">HIZUKU</div><div id="epTitle" class="sub">WEBTOON READER</div></header><main id="reader"></main><div id="controls" class="controls"><button id="prev">‹</button><select id="episodes"></select><button id="next">›</button></div><script>const DATA=[{id:1,title:'第1話',images:[]},{id:2,title:'第2話「契約」',images:[]}];let idx=+(localStorage.hizukuEp||0);const r=document.querySelector('#reader'),s=document.querySelector('#episodes'),h=document.querySelector('#head'),c=document.querySelector('#controls');DATA.forEach((e,i)=>s.add(new Option(e.title,i)));function draw(){idx=Math.max(0,Math.min(DATA.length-1,idx));localStorage.hizukuEp=idx;s.value=idx;document.querySelector('#epTitle').textContent=DATA[idx].title;document.querySelector('#prev').disabled=!idx;document.querySelector('#next').disabled=idx===DATA.length-1;r.innerHTML=DATA[idx].images.length?DATA[idx].images.map(x=>`<img class="page" src="${x}" loading="lazy">`).join(''):'<div class="empty"><b>'+DATA[idx].title+'</b>縦スクロール原稿を追加すると、ここに自動で連結表示されます。</div>';scrollTo(0,+(localStorage['hizukuY'+idx]||0))}s.onchange=()=>{idx=+s.value;draw()};document.querySelector('#prev').onclick=()=>{idx--;draw()};document.querySelector('#next').onclick=()=>{idx++;draw()};r.onclick=()=>{h.classList.toggle('hide');c.classList.toggle('hide')};addEventListener('scroll',()=>{let m=document.documentElement.scrollHeight-innerHeight,y=scrollY;document.querySelector('#bar').style.width=(m?y/m*100:0)+'%';localStorage['hizukuY'+idx]=y},{passive:true});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');draw();</script></body></html>
